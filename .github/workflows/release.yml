name: Release

# Promotes a tag to a published image. CI proves every commit builds and scans clean;
# this is the thing that takes one of those commits and puts it somewhere a cluster can
# pull it from. Nothing else in the repository pushes to a registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the version everything else carries
        # The version lives in three files. A tag that disagrees with any of them would
        # publish an image the manifest never references, so stop before anything is
        # built rather than leave a half-done release to unpick.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "Tag says $version. Checking the files that repeat it..."

          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          manifest=$(sed -n 's|.*image: .*/traefik-ratelimit-store:\(.*\)|\1|p' deploy/traefik-ratelimit-store.yaml | head -1)

          fail=0
          [ "$crate" = "$version" ]    || { echo "Cargo.toml says $crate"; fail=1; }
          [ "$manifest" = "$version" ] || { echo "deploy manifest says $manifest"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "To fix: set all three to the same version, commit, then move the tag."
            echo "  Cargo.toml, deploy/traefik-ratelimit-store.yaml, README.md"
            exit 1
          fi
          echo "Cargo.toml and the deploy manifest both agree."

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The exact version and nothing else. The deployment pulls IfNotPresent, which
          # is only safe while a tag means one image forever; a moving tag would let two
          # nodes run different code under the same name.
          tags: type=semver,pattern={{version}}
          # Restricting the tag list above is not enough on its own: the default flavor is
          # latest=auto, which appends `latest` to any semver tag and moves it off the
          # previous release. That is the moving tag this whole design avoids.
          flavor: latest=false

      # Each architecture is built and loaded on its own, because a scanner needs a single
      # image to look at and `load` cannot take a manifest list. The push below is a cache
      # hit on both of these, so what ships is exactly what was scanned. The caches are
      # scoped per architecture; sharing one scope would make each build evict the other.
      - name: Build for the scanner (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build for the scanner (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:scan-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # The same gate CI applies, but here it decides whether the image is published at
      # all. A fixable critical finding stops the release with nothing pushed. Both
      # variants are scanned rather than one taken as representative: they are separate
      # artefacts, and only scanning both makes the published manifest list clean.
      - name: Scan the image (amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-amd64
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the image (arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-arm64
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push the image
        # One tag resolving to a manifest list, so amd64 nodes and arm64 nodes pull the
        # same reference and each gets its own build.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: Create the release
        # --verify-tag refuses to invent a tag if the ref disappeared underneath us.
        # --notes is prepended to the generated changelog, so the image reference is the
        # first thing in the release and the commit list follows it. The range for that
        # list is worked out server-side, which is why nothing here needs git history.
        run: |
          set -euo pipefail
          echo "Creating the release for $GITHUB_REF_NAME..."
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
          echo "Release created."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
