# The rate-limit store: three replicas sharing counters over a full peer mesh.
#
# Two Services, deliberately. Traefik connects to the ClusterIP one and must be given
# exactly one address — it builds a cluster client the moment more than one endpoint is
# configured, and that client immediately asks for CLUSTER SLOTS. The headless one exists
# only so the replicas can resolve each other; its DNS name returns one A record per ready
# pod, which is the whole of peer discovery.

apiVersion: v1
kind: Service
metadata:
  name: traefik-ratelimit-store
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  type: ClusterIP
  selector:
    app: traefik-ratelimit-store
  ports:
    - name: resp
      port: 6379
      targetPort: resp

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-ratelimit-store-peers
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  clusterIP: None
  selector:
    app: traefik-ratelimit-store
  ports:
    - name: peers
      port: 8080
      targetPort: peers
  # Reports must reach a replica while it is still serving, and a replica that is briefly
  # unready is still counting — so peers stay addressable throughout.
  publishNotReadyAddresses: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-ratelimit-store
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  replicas: 3
  # Replace in place rather than surging a fourth pod: counters are disposable and the
  # PodDisruptionBudget keeps two replicas serving, so a rollout should not need a free
  # scheduling slot the size of another replica to make progress.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: traefik-ratelimit-store
  template:
    metadata:
      labels:
        app: traefik-ratelimit-store
    spec:
      # Counters are disposable, so losing a replica costs a window of budget, not
      # correctness. Spreading them means one node cannot take the whole mesh.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: traefik-ratelimit-store
      # A hung replica is worse than a dead one: the client does not retry a timeout, so it
      # becomes a 500 where a closed connection would have been retried onto a healthy
      # replica. On SIGTERM the process fails readiness, keeps serving for its drain
      # period (DRAIN_PERIOD_MS), then exits — so connections are closed rather than left
      # to stall, and this must stay longer than that drain period.
      terminationGracePeriodSeconds: 20
      containers:
        - name: store
          # The published release. IfNotPresent is safe because a version tag names one
          # image forever, and it lets a locally built image of the same name win, so
          # the development flow in the README needs no registry at all.
          image: ghcr.io/deyanp/traefik-ratelimit-store:0.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: resp
              containerPort: 6379
            - name: peers
              containerPort: 8080
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0:6379"
            - name: PEER_LISTEN_ADDRESS
              value: "0.0.0.0:8080"
            # Resolves to every ready pod, which is the entire discovery mechanism. The
            # trailing dot makes the name absolute, and matters more than it looks: the
            # name has four dots, under the pod's ndots:5, so without it the resolver
            # walks three search-list suffixes to NXDOMAIN before asking for the name
            # itself — four attempts, each an A and an AAAA query, for every lookup.
            # Keep the dot. The answer is then reused for a couple of seconds rather than
            # resolved every round, so the mesh costs the cluster resolver about one
            # lookup a second per replica instead of seven.
            - name: PEER_ENDPOINT
              value: "traefik-ratelimit-store-peers.default.svc.cluster.local.:8080"
            - name: PEER_PUBLISH_INTERVAL_MS
              value: "150"
            # Without this the replicas refuse to start, deliberately. An unauthenticated
            # peer endpoint lets anyone refill or drain any bucket on any replica, so the
            # choice has to be made rather than defaulted into.
            #
            #   kubectl create secret generic traefik-ratelimit-store \
            #       --from-literal=peer-shared-secret="$(openssl rand -hex 32)"
            - name: PEER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: traefik-ratelimit-store
                  key: peer-shared-secret
            # Identity, used to discard a replica's own echo. No downward API needed.
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The entry ceiling is derived from this rather than set beside it, because
            # the two are one decision: a ceiling above the limit means the process is
            # killed before the trim that exists to prevent that ever runs. Read from the
            # container's own memory limit, so there is nothing to keep in step: change
            # the limit below and the ceiling follows. (Left unset, the store reads the
            # cgroup limit itself and arrives at the same figure.)
            - name: STORE_MEMORY_BUDGET_MB
              valueFrom:
                resourceFieldRef:
                  containerName: store
                  resource: limits.memory
                  divisor: 1Mi
            # Runtime worker threads. The default is the node's core count, which on a
            # wide node means dozens of threads migrating a few hundred connection tasks
            # between cores for no gain; four carry the measured load with room to spare.
            - name: TOKIO_WORKER_THREADS
              value: "4"
            - name: RUST_LOG
              value: "info"
          resources:
            # Memory request equals the limit, so the pod is never the one evicted under
            # node pressure — the proxy answers any store error with a 500. The CPU request
            # is a floor, not a cap: with no CPU limit the store bursts to whatever the
            # node has free, and the request only decides its weight when the node is
            # contended. 150m schedules three replicas onto small shared nodes; raise it
            # toward a full core per replica when a measured production load justifies
            # reserving that much. No CPU limit, deliberately: CFS throttling is what
            # turns a busy replica into tail latency.
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "128Mi"
          # Readiness answers for the RESP port by connecting to it, so a replica whose
          # protocol listener has stopped leaves the rotation even though the endpoint
          # serving this probe is still healthy. It also fails immediately on SIGTERM, so
          # the replica is withdrawn before its listener closes — which is the whole point
          # of the grace period below.
          # Period times threshold must stay below the drain period (DRAIN_PERIOD_MS, five
          # seconds by default): the drain is what gives a failing probe time to be seen.
          # Deleting a pod withdraws it from the Service on its own; the probe is the
          # safety net for the cases that are not a deletion.
          readinessProbe:
            httpGet:
              path: /readiness
              port: peers
            periodSeconds: 2
            failureThreshold: 2
          # Deliberately a different endpoint. Pointing liveness at readiness would make a
          # draining replica look dead and get it killed part-way through the drain.
          livenessProbe:
            httpGet:
              path: /health
              port: peers
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: traefik-ratelimit-store
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: traefik-ratelimit-store

---
# Who may talk to the store. The protocol port accepts AUTH unconditionally — it trusts the
# network — so without this anything in the cluster can drive any bucket; the peer port is
# authenticated but still has no business being reachable from anywhere but the replicas.
# Adjust the Traefik selector to the labels your Traefik pods carry. Note that the CNI must
# enforce NetworkPolicy for this to hold: flannel (k3s, k3d) does not.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-ratelimit-store
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: traefik-ratelimit-store
  policyTypes: ["Ingress"]
  ingress:
    # The protocol port: Traefik, and nothing else.
    - from:
        - podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 6379
    # The peer port: the replicas themselves. The kubelet's probes originate from the node
    # and are not subject to ingress policy on most CNIs; if yours blocks them, add the
    # node CIDR here.
    - from:
        - podSelector:
            matchLabels:
              app: traefik-ratelimit-store
      ports:
        - protocol: TCP
          port: 8080
