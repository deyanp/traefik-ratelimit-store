# The rate-limit store: three replicas sharing counters over a full peer mesh.
#
# Two Services, deliberately. Traefik connects to the ClusterIP one and must be given
# exactly one address — it builds a cluster client the moment more than one endpoint is
# configured, and that client immediately asks for CLUSTER SLOTS. The headless one exists
# only so the replicas can resolve each other; its DNS name returns one A record per ready
# pod, which is the whole of peer discovery.

apiVersion: v1
kind: Service
metadata:
  name: traefik-ratelimit-store
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  type: ClusterIP
  selector:
    app: traefik-ratelimit-store
  ports:
    - name: resp
      port: 6379
      targetPort: resp

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-ratelimit-store-peers
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  clusterIP: None
  selector:
    app: traefik-ratelimit-store
  ports:
    - name: peers
      port: 8080
      targetPort: peers
  # Reports must reach a replica while it is still serving, and a replica that is briefly
  # unready is still counting — so peers stay addressable throughout.
  publishNotReadyAddresses: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-ratelimit-store
  namespace: default
  labels:
    app: traefik-ratelimit-store
spec:
  replicas: 3
  selector:
    matchLabels:
      app: traefik-ratelimit-store
  template:
    metadata:
      labels:
        app: traefik-ratelimit-store
    spec:
      # Counters are disposable, so losing a replica costs a window of budget, not
      # correctness. Spreading them means one node cannot take the whole mesh.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: traefik-ratelimit-store
      # A hung replica is worse than a dead one: the client does not retry a timeout, so it
      # becomes a 500 where a closed connection would have been retried onto a healthy
      # replica. Draining closes connections rather than letting them stall.
      terminationGracePeriodSeconds: 15
      containers:
        - name: store
          image: traefik-ratelimit-store:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: resp
              containerPort: 6379
            - name: peers
              containerPort: 8080
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0:6379"
            - name: PEER_LISTEN_ADDRESS
              value: "0.0.0.0:8080"
            # Resolves to every ready pod, which is the entire discovery mechanism.
            - name: PEER_ENDPOINT
              value: "traefik-ratelimit-store-peers.default.svc.cluster.local:8080"
            - name: PEER_PUBLISH_INTERVAL_MS
              value: "150"
            - name: PEER_STALENESS_LIMIT_MS
              value: "1000"
            # Identity, used to discard a replica's own echo. No downward API needed.
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /readiness
              port: peers
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /readiness
              port: peers
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: traefik-ratelimit-store
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: traefik-ratelimit-store
